name: Stability Atlas v2.2

on:
  push:
    branches:
      - chatgpt/stability-atlas-v2-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas PyYAML pytest
          python -m pip install -e . --no-deps

      - name: Unit tests
        run: |
          PYTHONPATH=src python -m pytest -q             tests/test_soft_consensus.py             tests/test_soft_consensus_v2_2.py

      - name: Build Stability Atlas v2.2
        run: |
          PYTHONPATH=src python scripts/build_soft_consensus_v2_2.py             --output-dir outputs/stability_atlas_v2_2             --config configs/stability_atlas_v2_2_1.yaml

      - name: Validate and print robustness findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("outputs/stability_atlas_v2_2")
          atlas = pd.read_csv(root / "municipality_affinity_atlas.csv")
          lofo = pd.read_csv(root / "leave_one_family_out_summary.csv")
          anchor = pd.read_csv(root / "anchor_affinity_summary.csv")
          f = pd.read_csv(root / "F_DG_transition_atlas.csv")
          be = pd.read_csv(root / "BE_metropolitan_gradient.csv")
          profile = pd.read_csv(root / "profile_robustness_summary.csv")
          manifest = json.loads((root / "run_manifest.json").read_text(encoding="utf-8"))

          assert len(atlas) == 1904
          assert len(f) == 327
          assert len(be) == 284
          assert atlas["panel_index"].is_unique
          assert manifest["atlas_version"] == "2.2.1"
          assert manifest["runs_per_family"] == {
              "perturbation": 50, "alpha": 2, "gamma": 3, "algorithm": 1
          }
          assert not any(col.startswith("weight_") for col in atlas.columns)
          assert all(f"D_G_transition_direction" in f.columns for _ in [0])
          assert set(f["D_G_transition_direction"]) <= {"D-leaning", "G-leaning", "mixed"}

          print("\n=== PROFILE ROBUSTNESS SUMMARY ===")
          print(profile.to_string(index=False))

          print("\n=== LEAVE-ONE-FAMILY-OUT: ALL MUNICIPALITIES ===")
          print(
              lofo[lofo["reference_profile"] == "ALL"]
              [["omitted_family","n","share_matches_full_consensus",
                "share_matches_reference","median_affinity_entropy",
                "median_affinity_margin"]]
              .to_string(index=False)
          )

          print("\n=== LEAVE-ONE-FAMILY-OUT: F ONLY ===")
          print(
              lofo[lofo["reference_profile"] == "F"]
              [["omitted_family","n","share_matches_full_consensus",
                "share_matches_reference","share_D_side","share_G_side",
                "median_affinity_entropy","median_affinity_margin"]]
              .to_string(index=False)
          )

          print("\n=== F HARD CONSENSUS CLASS COUNTS ===")
          print(f["consensus_class"].value_counts().sort_index().to_string())

          print("\n=== F D-G TRANSITION DIRECTION ===")
          print(f["D_G_transition_direction"].value_counts().to_string())

          print("\n=== F LOFO CLASS STABILITY ===")
          print(f["lofo_class_match_count"].value_counts().sort_index().to_string())

          print("\n=== ANCHOR SENSITIVITY ===")
          print(anchor.to_string(index=False))

          print("\n=== LOWEST LOFO-STABILITY F CASES ===")
          print(
              f.sort_values(
                  ["lofo_class_match_count","affinity_margin","affinity_entropy"],
                  ascending=[True,True,False],
              )
              .head(25)
              [["municipality","consensus_class","D_G_transition_direction",
                "affinity_share_D","affinity_share_F","affinity_share_G",
                "lofo_class_match_count","lofo_DG_side_match_count",
                "anchor_consensus_class","affinity_entropy","affinity_margin"]]
              .to_string(index=False)
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stability-atlas-v2-2
          path: outputs/stability_atlas_v2_2/
          if-no-files-found: error
