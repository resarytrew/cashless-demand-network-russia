experiment:
  id: profile_cards_20261008_v4
  generator_version: 4
  output_dir: outputs/final_competition_upgrade/profile_cards_20261008_v4
  public_json: site/data/profile_cards.json
  reference_n: 1904
  feature_csv: outputs/round16_competition/december_municipality_features.csv
  atlas_csv: outputs/stability_atlas_v2_2_1/municipality_affinity_atlas.csv
  external_csv: outputs/final_competition_upgrade/external_validation_national_20261006_r6/external_validation_joined.csv
  external_summary_csv: outputs/final_competition_upgrade/external_validation_national_20261006_r6/external_profile_summary.csv
  perturbation_csv: outputs/perturbation_v2/perturbation_v2_50_archetype_retention.csv
  atlas_summary_csv: outputs/stability_atlas_v2_2_1/profile_robustness_summary.csv
  representation_overlap_csv: outputs/round18_representation/profile_overlap.csv
  evidence_matrix_csv: outputs/evidence_v2_2_0/MASTER_PROFILE_EVIDENCE_MATRIX_v2.2.0.csv
  expected_external_population_n: 1903
  representative_count: 3
  headline_territory_count: 5
  representative_rule: >-
    Keep municipalities whose full Atlas consensus matches the reference and whose
    class is unchanged when each robustness family is omitted; then rank by distance
    to the componentwise median in the reference December feature space, breaking
    ties by the frozen panel index. D keeps the three curated headline cities only;
    its representatives remain algorithmic. F shows a D-leaning case, a G-leaning
    case and the smallest Atlas affinity margin. C shows uncertainty cases.
  counterexample_rule: >-
    Across selected representatives, search robust municipalities from another A-G
    profile with the same administrative form and observed population, wage and
    employment, minimizing the sum of absolute log ratios; use a transition fallback
    only when no robust candidate exists, then tie by names.
  counterexample_match_quality:
    strong_max_abs_difference_pct: 25
    moderate_max_abs_difference_pct: 50
  public_wording_thresholds:
    core_stable_min: 0.90
    core_generally_stable_min: 0.75
    boundary_diffuse_below: 0.40
  reference_features:
    composition: [Food, Health, Catering, Marketplace, Transport, Other]
    structure_weight: 0.70
    level_weight: 0.30

profiles:
  A:
    display_name: "Северный ресурсный"
    scientific_name: "Высокоинтенсивный профиль безналичного спроса"
    short_name: "A · Северный ресурсный"
    status: SUPPORTED
    evidence_status: "candidate overlapping network regime"
    status_note: "ядро выражено, границы размыты"
    public_copy:
      subtitle: "Высокие зарплаты · общепит выше нормы · маркетплейсы ниже нормы"
      warning: ""
      who: >-
        Преимущественно северные и дальневосточные территории с добывающей,
        энергетической и промышленной экономикой: Алданский район, Ногликский округ,
        Заполярный район, Комсомольск‑на‑Амуре, Биробиджан. По численности это обычные
        для выборки территории, но с нетипично высокими зарплатами и заметно большей
        занятостью. В структуре занятости больше энергетики, коммунальной инфраструктуры
        и строительства, меньше образования и торговли.
      demand_lead: "Безналичные расходы на жителя — 51 тыс. ₽ в месяц, в полтора раза выше общей медианы."
      table_categories: [Catering, Marketplace, Health]
      interpretation: >-
        Высокий общепит согласуется с вахтовой и командировочной занятостью; низкие
        маркетплейсы и здоровье — с удалённостью от логистических и медицинских центров.
        Это профиль не просто богатых городов, а территорий, где денег много, а
        доступное предложение ограничено. Интерпретация требует отдельной проверки.
      representative_reasons:
        "Алданский муниципальный район": "Ближе всех к центру профиля: 55,6 тыс. ₽ на жителя, зарплата 140 тыс. ₽, золотодобывающая специализация."
        "городской округ Ногликский": "Нефтегазовый Сахалин; 55,9 тыс. ₽ безналичных расходов на жителя."
        "муниципальный район Заполярный район": "Нефтедобывающая территория НАО; 51,8 тыс. ₽ на жителя."
      counterexample: >-
        Лаишевский район сопоставим с Алданским по масштабу, но зарплаты там на четверть
        ниже, расходы на жителя — 42 тыс. ₽ против 56 тыс., а маркетплейсы занимают
        большую долю. Он устойчиво относится к профилю промышленных городов D.
      reliability: >-
        Ядро устойчиво: 96,5% территорий сохраняют метку A в сводном атласе, а при
        50 случайных возмущениях в среднем остаётся 94% ядра. Точная граница заметно
        меняется при альтернативных представлениях данных.
      boundary: >-
        Спорные случаи — Кош‑Агачский район Алтая, Тандинский и Улуг‑Хемский районы
        Тувы. По структуре трат они похожи на A, но по сводным сетевым связям ближе к C.
      use: "Использовать как группу сравнения для территорий с ресурсной экономикой."
      avoid: "Не использовать как прогноз роста или сегментацию клиентов: профиль описывает территории, а не отдельных людей."

  B:
    display_name: "Деловые районы мегаполисов"
    scientific_name: "Высокоинтенсивный внутригородской профиль безналичного спроса"
    short_name: "B · Деловые районы"
    status: PRELIMINARY
    evidence_status: "candidate federal-intracity subtype"
    status_note: "предварительный внутригородской подтип; граница с E нестабильна"
    public_copy:
      subtitle: "Общепит втрое выше нормы · продукты на треть ниже · высокая концентрация рабочих мест"
      warning: >-
        Профиль состоит преимущественно из внутригородских территорий Москвы и
        Санкт‑Петербурга. Показатели на жителя считаются по месту операции, поэтому
        прямое сравнение с самостоятельными городами и районами ограничено.
      who: >-
        Деловые и смешанные районы крупных агломераций: Марьина роща, Донской,
        Алексеевский, Свиблово, Даниловский. Медианная численность — 76 тыс. жителей,
        зарплата работников организаций — 162 тыс. ₽. На район приходится 27 тыс.
        работников организаций, или примерно треть численности населения. В занятости
        больше торговли и профессиональных услуг, меньше образования и госуправления.
      demand_lead: "Безналичные расходы на жителя — 67 тыс. ₽ в месяц, примерно вдвое выше общей медианы."
      table_categories: [Catering, Transport, Marketplace, Food]
      interpretation: >-
        Высокие расходы и общепит согласуются с концентрацией рабочих мест, сервисов и
        дневного потока посетителей. Низкая доля продуктов и маркетплейсов отличает
        деловые районы от жилой периферии. Это характеристика места совершения операций,
        а не потребительского поведения зарегистрированных жителей.
      representative_reasons:
        "внутригородская территория города федерального значения муниципальный округ Марьина роща": "Ближе всех к центру профиля; 69 тыс. ₽ расходов на жителя и 33 тыс. работников организаций."
        "внутригородская территория города федерального значения муниципальный округ Донской": "69 тыс. ₽ расходов на жителя; число работников организаций почти равно численности жителей."
        "внутригородская территория города федерального значения муниципальный округ Алексеевский": "Крупнейший из трёх типичных районов; расходная подпись почти совпадает с центром профиля."
      counterexample: >-
        Алексеевский и Печатники близки по численности и зарплатам, но в Алексеевском
        расходы на жителя составляют 69 тыс. ₽ против 55 тыс. ₽, а доля маркетплейсов
        ниже. Печатники относятся к жилому профилю E.
      reliability: >-
        Собственное ядро B сохраняется, но граница с E неустойчива. При альтернативных
        представлениях все исходные территории B оказываются внутри общей группы из
        280–289 территорий — примерно столько же, сколько B и E вместе.
      boundary: >-
        Солнцево, Строгино и Митино остаются в B, но следующим по близости для них идёт E.
        Граница проходит внутри единого городского макропрофиля, а не между городом и селом.
      use: "Использовать как ориентир для деловых и сервисных районов крупнейших агломераций."
      avoid: "Не сравнивать показатели на жителя напрямую с муниципальными районами и не трактовать B отдельно от E."

  C:
    display_name: "Горные республики"
    scientific_name: "Неопределённый профиль локального спроса"
    short_name: "C · Горные республики"
    status: UNRESOLVED
    evidence_status: "rejected as standalone profile"
    status_note: "профиль не разрешён; состав и границы нестабильны"
    representatives_heading: "Иллюстративные случаи"
    public_copy:
      subtitle: "Транспорт и маркетплейсы выше нормы · продукты заметно ниже · профиль не подтверждён"
      warning: >-
        Это единственный профиль в атласе, который не прошёл проверку устойчивости.
        Его состав и границы меняются при смене метода; карточка описывает аномалию
        для отдельного изучения, а не готовую группу для прикладных сравнений.
      who: >-
        Почти все территории — горные районы национальных республик: Онгудайский,
        Усть‑Канский и Усть‑Коксинский районы Республики Алтай, Ардонский район
        Северной Осетии, Зеленчукский район Карачаево‑Черкесии. Население близко к
        общей медиане, но зарплата самая низкая среди профилей, формально занят лишь
        каждый девятый житель, а занятость сосредоточена в образовании и госуправлении.
      demand_lead: "Безналичные расходы на жителя — 28 тыс. ₽ в месяц, на 14% ниже общей медианы."
      table_categories: [Transport, Marketplace, Food]
      interpretation: >-
        Низкая доля продовольствия может означать, что часть оборота проходит через
        личные хозяйства, рынки и наличные. Высокий транспорт согласуется с горной
        местностью, а маркетплейсы — с ограниченной местной розницей. Это гипотезы:
        безналичные данные могут видеть здесь меньшую часть экономики, чем обычно.
      representative_reasons:
        "Онгудайский муниципальный район": "Иллюстрация горной периферии; принадлежность к C меняется при исключении семейств проверок."
        "Усть-Канский муниципальный район": "Показан как характерный случай, но не как устойчивое ядро."
        "Усть-Коксинский муниципальный район": "Близок к центру исходной группы, однако не удерживает метку во всех проверках."
      counterexample: >-
        Завьяловский район почти совпадает с Усть‑Коксинским по населению, зарплате и
        занятости, но расходы на жителя составляют 26 тыс. ₽ против 33 тыс. ₽. Он
        устойчиво относится к широкому профилю G.
      reliability: >-
        Ненадёжность — главный результат. В сводном атласе 93% территорий сохраняют
        метку C, но при возмущениях ядро удерживается в среднем лишь на 72%, а
        альтернативные представления дают группы размером от 23 до 43 территорий.
      boundary: >-
        У C нет собственной устойчивой границы: к нему тяготеют Кош‑Агачский район
        Алтая, Тандинский и Улуг‑Хемский районы Тувы. При разных методах эта зона
        отходит к A, образует отдельную группу или растворяется в G.
      use: "Использовать как исследовательскую гипотезу и предупреждение о неполной наблюдаемости безналичного оборота."
      avoid: "Не использовать как сегмент и не принимать решения по списку из 29 территорий."

  D:
    display_name: "Промышленные города"
    scientific_name: "Крупные центры локального спроса"
    short_name: "D · Промышленные города"
    status: SUPPORTED
    evidence_status: "candidate profile with boundary caveat"
    status_note: "компактное ядро, точная граница изменчива"
    headline_override:
      - "городской округ город Оренбург"
      - "городской округ Магнитогорский"
      - "городской округ город Тамбов"
    public_copy:
      subtitle: "Общепит вдвое выше нормы · маркетплейсы и продукты ниже · промышленная занятость"
      warning: ""
      who: >-
        Средние и крупные промышленные города: Оренбург, Магнитогорск, Тамбов, Миасс,
        Иваново, Ковров. Медианная численность — 130 тыс. жителей, работников
        организаций — 28 тыс. Формально занят каждый пятый житель. Главная внешняя
        подпись — избыток обрабатывающих производств на 23,9 п.п. и дефицит образования
        и государственного управления. Зарплаты умеренные: 75 тыс. ₽.
      demand_lead: "Безналичные расходы на жителя — 42 тыс. ₽ в месяц, на 29% выше общей медианы."
      table_categories: [Catering, Transport, Marketplace, Food]
      interpretation: >-
        Расходная структура согласуется с городской концентрацией торговли, услуг и
        общепита. Возможный приток покупателей из соседних районов и замещение
        онлайн‑покупок местным предложением требуют отдельной проверки и не следуют
        непосредственно из кластеризации.
      representative_reasons:
        "городской округ Миасский": "Ближе всех к центру профиля; 43 тыс. ₽ расходов на жителя и выраженная промышленная занятость."
        "городской округ Иваново": "Областной центр с той же расходной подписью, несмотря на другой масштаб и историю."
        "городской округ город Ковров": "Старый промышленный город; структура спроса почти совпадает с Миассом и Ивановом."
      counterexample: >-
        Уссурийск крупнее Миасса, а зарплаты почти одинаковы, но расходы на жителя
        составляют 53 тыс. ₽ против 43 тыс. ₽ и доля маркетплейсов заметно ниже.
        Уссурийск устойчиво относится к северному ресурсному профилю A.
      reliability: >-
        Ядро — одно из самых прочных: 98,7% территорий сохраняют метку D в сводном
        атласе, при возмущениях остаётся в среднем 98% ядра. Охват определён хуже:
        альтернативные представления дают группы от 144 до 318 территорий.
      boundary: >-
        Колпино и Морские ворота тяготеют к городскому профилю E. Лесосибирск остаётся
        в D с большим отрывом. Часть границы проходит между единицами разного
        административного уровня.
      use: "Использовать как группу сравнения для промышленных городов."
      avoid: "Не использовать как точный и неизменный список из 153 городов: состав за пределами ядра зависит от метода."

  E:
    display_name: "Спальные районы мегаполисов"
    scientific_name: "Профиль повышенного безналичного спроса"
    short_name: "E · Спальные районы"
    status: PRELIMINARY
    evidence_status: "candidate/contextual profile"
    status_note: "предварительный профиль; граница с B нестабильна"
    public_copy:
      subtitle: "Общепит почти втрое выше нормы · продукты на четверть ниже · формально занят каждый восьмой житель"
      warning: >-
        Как и B, профиль состоит преимущественно из внутригородских территорий.
        Показатели на жителя считаются по месту операции, поэтому прямое сравнение с
        самостоятельными городами и районами ограничено.
      who: >-
        Жилые районы Москвы и Санкт‑Петербурга, удалённые от делового центра:
        Текстильщики, Гольяново, Алтуфьевский, Бибирево, Парголово. Медианная
        численность — 85 тыс. жителей, зарплата — 115 тыс. ₽. Работников организаций
        всего 11 тыс. на район, или 13% населения: люди здесь живут, а работают в
        другом месте. В профиль входят и отдельные крупные региональные города.
      demand_lead: "Безналичные расходы на жителя — 57 тыс. ₽ в месяц, в 1,7 раза выше общей медианы."
      table_categories: [Catering, Transport, Food, Marketplace]
      interpretation: >-
        По расходной структуре E занимает промежуточное положение между деловыми
        районами B и промышленными городами D. Высокая доля транспорта согласуется с
        маятниковыми поездками, однако данные по месту операции не позволяют напрямую
        измерить ежедневную миграцию.
      representative_reasons:
        "внутригородская территория города федерального значения муниципальный округ Текстильщики": "Ближе всех к центру профиля; около 58 тыс. ₽ расходов на жителя."
        "внутригородская территория города федерального значения муниципальный округ Гольяново": "Жилой район востока Москвы с расходной подписью, почти совпадающей с центром E."
        "внутригородская территория города федерального значения муниципальный округ Алтуфьевский": "Северный жилой район; сохраняет принадлежность при исключении семейств проверок."
      counterexample: >-
        Левобережный почти совпадает с Алтуфьевским по населению, зарплате и числу
        работников, но расходы на жителя различаются на четверть: 72 тыс. ₽ против
        58 тыс. ₽. Левобережный относится к деловому профилю B.
      reliability: >-
        Устойчивость средняя: 91% территорий сохраняют метку E в сводном атласе, при
        возмущениях остаётся в среднем 87% ядра. В альтернативных представлениях B и E
        сливаются в одну группу из 280–289 территорий.
      boundary: >-
        Мурманск тяготеет к A, Кашира и Зеленоградский — к D. Профиль граничит сразу
        с деловыми районами, промышленными городами и удалёнными территориями.
      use: "Использовать как группу сравнения для жилых районов крупных городов и как иллюстрацию маятниковой экономики."
      avoid: "Не трактовать как самостоятельный тип в отрыве от B; корректнее говорить о периферийной части городского макропрофиля."

  F:
    display_name: "Малые промышленные города"
    scientific_name: "Переходные зоны спроса"
    short_name: "F · Переходный слой"
    status: TRANSITION
    evidence_status: "weak refinement / boundary population"
    status_note: "переходный профиль между D и G"
    representatives_heading: "Три стороны переходного слоя"
    public_copy:
      subtitle: "Собственной подписи нет · большинство долей близко к норме · профиль почти не сохраняется в сводном атласе"
      warning: >-
