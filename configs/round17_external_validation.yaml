report_paragraphs:
- 'A / Yakutia: within A (n=27), wage/investment association is positive, including HC3 OLS conditional on log population
  and urban share. HC3 uses normal-reference p-values (use_t=False). This is association, not an investment effect.
  The nonsignificant wage/population correlation does not demonstrate population independence or show that population
  has no explanatory role. Selected A includes varied municipality sizes; a large-city-only or mining-only interpretation
  is not established.'
- 'A / Chukotka: four A municipalities provide descriptive wage medians only. Nominal wages, northern price levels
  and employee coverage limit income interpretations. Sector mechanisms, extraction/mining and household prosperity
  are NOT_ESTABLISHED. The 2024/2025 Yakutia wage correlation describes wage ranks, not persistence of network labels.'
- 'D-F-G / Altai: D2/F1/G3, n=6. Coding G=1, F=2, D=3 makes positive rho mean higher wages toward D. Medians D=73525.45,
  F=65317.7, G=55749.4 rubles. The unadjusted gradient is consistent with a transition interpretation in this selected
  regional sample. The tied-rank asymptotic Spearman p is not an exact small-sample permutation result. Adjusted
  OLS retains beta=0.193626 but p=0.088869, with only two residual degrees of freedom; uncertainty must not be omitted.
  No national or causal D-to-G transition claim follows.'
- 'Khabarovsk: A11/G4; Cliff delta=0.409091, Mann-Whitney p=0.279853. The direction is moderate, uncertainty substantial.
  Wages are not established as a sufficient external A/G separator. This negative/uncertain result is retained.'
- 'F: internal Atlas shows low autonomous consensus membership and strong D/G proximity, alongside entropy, margin,
  destination and leave-one-family-out diagnostics below. The limited external gradient is consistent with F as
  a boundary/transition population. This is combined interpretation evidence, not equal standing as an autonomous
  robust economic archetype and not a change to prior robustness status.'
- 'B-E: external B=0 and E=0. Internal balanced/algorithm cross-coassignment is reported separately below. It supports
  an internal structural-family hypothesis; the metropolitan-like economic interpretation remains EXTERNALLY_UNVALIDATED.
  C: four selected Altai observations do not establish independent substantive structure; contextual/unresolved.
  Historical rejection of C as a beyond-context archetype remains in force.'
- All inferential p-values are exploratory, unadjusted and conditional on the recovered selected sample; geographic
  clustering, selection, multiple testing and sparse group sizes limit inference. External measurements did not
  tune alpha, k, omega, resolution, labels or Atlas classes. Total/category additivity and the denominator remain
  unresolved.
- 'Local cashless demand contains network-temporal regimes with unequal stability: persistent cores, uncertain boundaries,
  nested and contextual areas. Independent socioeconomic observations corroborate parts of that interpretation in
  limited regions; they do not establish seven equal universal economic archetypes.'
readme: '# Round17 external economic validation


  Offline replay of 58 normalized observations, matched to current Atlas v2.2.1.

  Read INDEPENDENT_ECONOMIC_VALIDATION.md and RECOVERY_AUDIT.md for scope.


  From repository root (installed package):


  ```sh

  python scripts/run_round17_external_validation.py

  python scripts/run_round17_external_validation.py --output-dir /path/to/empty/replay

  ```


  The first command verifies a completed package; the second computes a fresh replay.

  No original Rosstat files or internet are required after dependency installation.

  Completed or partial evidence is never overwritten. Partial runs require a new directory.

  run_manifest.json seals all outputs including inventories; COMPLETED.json seals that manifest.

  CSV/statistics/report are deterministic; runtime manifests record timestamp and environment.

  Source recovery is preserved separately under reference/round17_external_validation/recovered/.

  '
dictionary_addendum: 'Round17 canonical additions: panel_index is inherited from current Atlas (not present historically);
  reference_profile is the recovered profile verified against current Atlas; consensus_class and stability_class
  are current Atlas classes verified against recovery. Atlas affinity, entropy, margin, destination precision/Jaccard
  and leave-one-family-out fields are copied from the pinned Atlas; shares are descriptive, not probabilities. historical_*
  fields retain the original recovered labels. match_status is exact name/profile/consensus/stability agreement.
  notes explicitly records the index limitation. Empty numeric fields are missing, never zero-imputed. source_provenance.csv
  uses 1-based data-record positions in the canonical table, not raw-document row numbers. Reported source hashes
  are unverified when raw files are unavailable. source_manifest.csv separates hash_type and reported_hash: the
  recovered Atlas hash was a Git blob SHA1 mislabeled under sha256, not a SHA256 file checksum. All other raw-source
  hashes are reported SHA256. Internal matrix row order is verified against Atlas panel_index. No source cell/page
  locations were supplied.'
audit: '# Round17 recovery/integration audit


  Original ZIP SHA256: c917d91e59c50dd367ba058b6b7f674325e46a54d54e1d080ccb460abc4a71a3.

  All 14 entries in the supplied SHA256SUMS.txt were checked before integration. All 15 package files are preserved
  byte-for-byte in reference/round17_external_validation/recovered. The reference Python implementation ran successfully;
  all 10 tests match the supplied expected values at tolerance 1e-10 * max(1, abs(expected)). Region/profile counts
  and DFG medians are gated too.


  58 exact municipality-name joins match current reference profile, consensus and stability; current Atlas bytes
  match the historical Git blob. No fuzzy matching or silent relabeling. Historical panel_index was NOT supplied:
  assigned from current Atlas, never described as historically verified. The recovered source_manifest hash column
  mislabeled the Atlas Git blob SHA1 as sha256; the derived manifest explicitly types it, and current Atlas SHA256
  is recorded separately. Recovered input files are not corrected.


  Original Rosstat documents, historical workbook, crosswalk file and row/page extraction locations are not packaged;
  reported raw-source SHA256 values cannot be verified locally. Normalized data/statistics replay offline, but original
  source extraction and historical workbook recovery do not. Population-source URL is missing in recovery and remains
  missing. source_provenance.csv maps every nonmissing normalized indicator to its reported source and canonical
  data-record position. Investments are available for 28 Yakutia cases only; 30 missing values are preserved. No
  proxy substitution.


  Independent package code reproduces the reference methods explicitly: two-sided Spearman with asymptotic p-values;
  Yakutia logsalary on intercept/loginvestment/logpopulation/urban share with HC3 normal inference; Altai logsalary
  on intercept/ordinal rank/logpopulation/urban share with conventional t inference; two-sided Mann-Whitney auto
  method and continuity correction with signed Cliff delta; descriptive medians. No fitting of clustering models
  or baseline rerun occurs.


  Interpretation deviations from recovery narrative are deliberate and conservative: nonsignificant population correlation
  does not establish independence; nominal employee wages are not household income; Altai F has n=1 and adjusted
  p=0.088869; Khabarovsk p=0.279853 retained; B/E have no external validation; C remains contextual; mining mechanism
  is unestablished. Old A-G robustness statuses and reference parameters are unchanged. New claims are interpretation
  support with scope limitations, not confirmatory tests.


  Round18 is planned separately and has no results here. Output completion is written last; any integration failure
  produces FAILURE_AUDIT.json with no completion seal. Sealed output is never overwritten.

  '
