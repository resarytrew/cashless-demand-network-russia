experiment:
  id: round19_dual_lens_l2
  output_dir: outputs/round19_dual_lens_l2
  reference_period: '2024-12-01'
  evidence_version: '2.6.0'

p0_gates:
  baseline_gate: outputs/presubmission_upgrade/baseline_gate/baseline_gate.json
  baseline_gate_manifest: outputs/presubmission_upgrade/baseline_gate/run_manifest.json
  baseline_supra_labels: outputs/baseline/supra_labels.csv
  baseline_static_labels: outputs/baseline/static_dec2024_labels.csv
  icvi_v2_manifest: outputs/final_competition_upgrade/icvi_v2/run_manifest.json
  synthetic_v4_manifest: outputs/final_competition_upgrade/synthetic_temporal_v4/run_manifest.json

sources:
  l1_config: configs/baseline.yaml
  lineage: outputs/final_competition_upgrade/data_sense_lineage_20261006_r3/reference_to_territory_id.csv
  national_external: outputs/final_competition_upgrade/external_validation_national_20261006_r6/external_validation_joined.csv
  market_access: data/external/staging/sberindex_data_sense_20251018/hackathonlicence/market_access.parquet
  december_features: outputs/round16_competition/december_municipality_features.csv
  profile_mapping: outputs/final_competition_upgrade/profile_mapping/raw_to_profile_mapping.csv
  mobility_holdout: data/raw/mobility.csv.zip

panel:
  policy: complete_case_verified_context
  required_lineage_status: VERIFIED_DATA_LINEAGE_MATCH
  required_scalar_features: [population, wage, market_access]
  unavailable_requested_features: [urban_share]

features:
  block_weights:
    l1: 0.3333333333333333
    socioeconomic: 0.3333333333333333
    employment: 0.3333333333333334
  socioeconomic:
    - {name: population, transform: log}
    - {name: wage, transform: log}
    - {name: market_access, transform: log}
  employment_sectors:
    - administrative
    - arts
    - construction
    - education
    - finance
    - health
    - hospitality
    - information
    - manufacturing
    - other_services
    - professional
    - public_administration
    - real_estate
    - trade
    - utilities
  employment_transform: rowwise_zero_replacement_then_clr

network:
  k: 20
  edge_rule: mutual_knn
  kernel: adaptive_rbf
  static_isolate_fallback: true
  temporal_isolate_fallback: false

temporal:
  omega: 2.0
  coupling_reference: global_median_intralayer_weight

clustering:
  algorithm: louvain
  resolution: 0.5
  seed: 0
  no_K_preselection: true

interpretation:
  major_min_share: 0.02
  standardized_descriptor_threshold: 0.5
  tree_max_depth: 4
  tree_min_samples_leaf: 40
  cv_folds: 5
  min_balanced_accuracy_for_names: 0.70
  min_class_recall_for_name: 0.60

holdout:
  variable: mobility_index
  source_column: value
  period: '2024-12-31'
  join_key: exact_municipality_name
  excluded_from_model: true
  minimum_group_n: 5
